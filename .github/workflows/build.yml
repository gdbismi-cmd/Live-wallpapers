name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runners ship with the Android SDK (ANDROID_HOME is set);
      # the Android Gradle plugin installs any missing platform automatically.
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aquarium-live-wallpaper-debug
          path: app/build/outputs/apk/debug/*.apk
